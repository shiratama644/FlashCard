name: CI

# 本番デプロイは Vercel の GitHub 連携に委譲する。
# このワークフローは PR / main で lint・typecheck・build（pnpm verify）を実行し、
# 壊れた変更がマージされないようにするための検証ゲート。
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm のバージョンは package.json の packageManager フィールドから解決する
      # （version を併記すると ERR_PNPM_BAD_PM_VERSION で衝突するため指定しない）。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            nextjs-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify (lint + typecheck + build)
        run: pnpm verify
